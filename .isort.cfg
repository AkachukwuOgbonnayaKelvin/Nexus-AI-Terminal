[settings]
profile = black
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = foundation,ndip,engines,workspaces,orchestrator,dashboard,qa,scripts
known_third_party = pytest,black,isort,flake8,mypy,pathlib
skip = .venv,__pycache__,tools/qa
