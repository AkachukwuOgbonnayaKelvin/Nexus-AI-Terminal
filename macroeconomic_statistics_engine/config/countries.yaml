# MAC-001 Country Configuration
# Defines all countries and their data sources

countries:
  US:
    name: "United States"
    currency: "USD"
    primary_sources:
      - fred
      - bea
      - bls
      - federal_reserve
    data_domains:
      - gdp
      - cpi
      - unemployment
      - rates
  
  EU:
